<footer id="contact" class="footer">
    <div class="footer__social">
        <ul class="social-list">
            <li class="social-list__item">
                <a class="social-list__link" href="{{social.linkedin}}" aria-label="LinkedIn profile of Jesus Marini Parissi">
                    <i class="fab fa-linkedin fa-lg" aria-hidden="true"></i>
                </a>
            </li>
            <li class="social-list__item">
                <a class="social-list__link" href="{{social.instagram}}" aria-label="Instagram profile of Jesus Marini Parissi">
                    <i class="fab fa-instagram-square fa-lg" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </div>
    <a class="footer__company" href="{{company.url}}" target="_blank" rel="noopener noreferrer">
        Visit {{company.name}} <span aria-hidden="true">↗</span>
    </a>
    <div class="footer__logo">
        <a href="{{basePath}}index.html#home" aria-label="Return to the home page">
            <img src="/img/jmp_logo_w.png" alt="Jesus Marini Parissi logo">
        </a>
    </div>
    <div class="footer__copy">
        Copyright <i class="far fa-copyright" aria-hidden="true"></i> {{copyrightYear}} Jesus Marini Parissi
    </div>
</footer>
